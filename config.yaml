# ==========================================================
# VisionSense AI CCTV Retail Analytics Configuration
# ==========================================================

vision:
  YOLO_MODEL: "yolo11n.pt"
  confidence: 0.25
  iou: 0.45
  imgsz: 512
  inference_fps: 20
  tracker: "bytetrack"
  lost_timeout_seconds: 5.0
  person_class_id: 0
  show_trails: true
  trail_length: 50

reid:
  enabled: false
  similarity_threshold: 0.75
  gallery_timeout_seconds: 300.0

analytics:
  database_flush_seconds: 5
  heatmap_sampling_seconds: 1
  snapshot_interval_seconds: 10
  max_buffer_size: 100

age_estimation:
  enabled: true
  minimum_confidence: 0.5

cameras:
  max_concurrent: 4
  default_fps: 25.0
  default_resolution: [1280, 720]
