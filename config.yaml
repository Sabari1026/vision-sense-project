# VisionSense Global Configuration File

vision:
  YOLO_MODEL: "yolo11n.pt"
  confidence: 0.45
  iou: 0.5
  inference_fps: 10
  tracker: "bytetrack"
  lost_timeout_seconds: 5
  person_class_id: 0

analytics:
  database_flush_seconds: 5
  heatmap_sampling_seconds: 1
  snapshot_interval_seconds: 10
  max_buffer_size: 100

age_estimation:
  enabled: true
  minimum_confidence: 0.5

cameras:
  max_concurrent: 4
  default_fps: 25
  default_resolution: [1280, 720]
